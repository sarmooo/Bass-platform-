# Ephemeral PostgreSQL for the kind end-to-end job. NOT for production — the Helm
# chart expects an externally-managed database (RDS/Cloud SQL) via
# secret.databaseUrl. This stands one up in-cluster so CI can exercise a real
# `helm install` + migration hook against a real Postgres.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              value: bass
            - name: POSTGRES_PASSWORD
              value: bass
            - name: POSTGRES_DB
              value: bass
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "bass"]
            initialDelaySeconds: 5
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
