{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bass.serviceAccountName" . }}
  labels:
    {{- include "bass.labels" . | nindent 4 }}
  {{- if .Values.migrations.enabled }}
  annotations:
    # The pre-install/pre-upgrade migration Job runs under this ServiceAccount, so
    # it must exist before the hook does — make it a hook too (created first, kept
    # afterwards for the Deployment).
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
  {{- end }}
{{- end }}
