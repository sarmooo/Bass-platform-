{{- if and .Values.secret.create (not .Values.secret.existingSecret) -}}
{{- if not .Values.secret.jwtSecret -}}
{{- fail "secret.jwtSecret is required when secret.create=true (or set secret.existingSecret)" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bass.secretName" . }}
  labels:
    {{- include "bass.labels" . | nindent 4 }}
  {{- if .Values.migrations.enabled }}
  annotations:
    # The migration Job is a pre-install/pre-upgrade hook and needs databaseUrl,
    # but normal resources are created *after* hooks — so the Secret must also be
    # a hook, created first (lower weight), and kept afterwards for the Deployment.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
  {{- end }}
type: Opaque
stringData:
  jwtSecret: {{ .Values.secret.jwtSecret | quote }}
  databaseUrl: {{ .Values.secret.databaseUrl | quote }}
{{- end }}
