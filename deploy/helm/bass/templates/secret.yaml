{{- if and .Values.secret.create (not .Values.secret.existingSecret) -}}
{{- if not .Values.secret.jwtSecret -}}
{{- fail "secret.jwtSecret is required when secret.create=true (or set secret.existingSecret)" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bass.secretName" . }}
  labels:
    {{- include "bass.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwtSecret: {{ .Values.secret.jwtSecret | quote }}
  databaseUrl: {{ .Values.secret.databaseUrl | quote }}
{{- end }}
