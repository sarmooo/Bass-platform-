[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bass"
version = "0.1.0"
description = "Enterprise AI automation platform — reference implementation"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
# The live Claude provider (bass.providers.AnthropicModel).
live = ["anthropic>=0.40"]
# The PostgreSQL state layer (bass.store_postgres.PostgresStore).
postgres = ["psycopg[binary]>=3.1"]
# The HTTP API (bass.api). Auth (bass.auth) is stdlib-only, no crypto dependency.
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
# Temporal durable-execution adapter (bass.temporal_adapter).
temporal = ["temporalio>=1.7"]
# Tooling used in CI.
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
bass-example = "bass.example_run:main"
bass-example-live = "bass.example_run_live:main"

[tool.setuptools.packages.find]
include = ["bass*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Real-error rules plus unused-import/var hygiene. Style is not enforced.
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.coverage.run]
source = ["bass"]
# Exercised only in the integration/live paths, not the unit job:
omit = ["bass/providers.py", "bass/store_postgres.py", "bass/example_run_live.py",
        "bass/temporal_adapter.py", "bass/runner.py"]

[tool.coverage.report]
show_missing = true
