name: Release

# Cut a release from a semver tag: build & push the versioned image, attach an
# SBOM + provenance, sign it with cosign (keyless), and publish a GitHub Release
# with autogenerated notes and the verifiable image reference.
#
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/sarmooo/bass

jobs:
  release:
    name: Build, sign & publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write         # create the GitHub Release
      packages: write         # push to GHCR
      id-token: write         # cosign keyless (OIDC)
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push versioned image (SBOM + provenance)
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          sbom: true
          provenance: mode=max
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign & verify the release image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            > /dev/null
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Container image

            `${{ env.IMAGE }}:${{ github.ref_name }}`
            Digest: `${{ steps.push.outputs.digest }}`

            Signed with cosign (keyless, OIDC) and carries an SBOM + SLSA provenance
            attestation. Verify before deploying:

            ```bash
            cosign verify ${{ env.IMAGE }}@${{ steps.push.outputs.digest }} \
              --certificate-identity-regexp "https://github.com/${{ github.repository }}/.*" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
            ```
