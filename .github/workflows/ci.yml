name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege by default; the publish job widens its own scope.
permissions:
  contents: read

jobs:
  unit:
    name: Lint, types & unit tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"
      - name: Lint (ruff)
        run: ruff check bass tests
      - name: Type check (mypy)
        run: mypy bass
      - name: Test (pytest + coverage gate)
        run: pytest -q --cov=bass --cov-report=term-missing --cov-fail-under=80
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit

  integration-postgres:
    name: Integration tests (real PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bass
          POSTGRES_PASSWORD: bass
          POSTGRES_DB: bass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bass"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BASS_TEST_DB_URL: postgresql://bass:bass@localhost:5432/bass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (PostgreSQL driver + API)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres,api]"
      - name: Test (pytest, PostgreSQL store)
        run: pytest -q

  temporal:
    name: Temporal durable execution
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference
    env:
      BASS_TEST_TEMPORAL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (Temporal)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,temporal]"
      - name: Test (a Bass run driven by a Temporal workflow)
        run: pytest -q tests/test_temporal.py

  docker:
    name: Build, smoke-test & publish image
    runs-on: ubuntu-latest
    needs: [unit]
    permissions:
      contents: read
      packages: write
    env:
      # Image name (Docker path components can't end with '-', unlike the repo name).
      IMAGE: ghcr.io/sarmooo/bass
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:ci
      - name: Smoke-test the image (API boots, /healthz responds)
        run: |
          docker run -d --name bass -e BASS_JWT_SECRET=ci-secret -p 8000:8000 "${IMAGE}:ci"
          ok=""
          for _ in $(seq 1 25); do
            if curl -sf http://localhost:8000/healthz | grep -q ok; then ok=1; break; fi
            sleep 1
          done
          docker logs bass || true
          docker rm -f bass
          test -n "$ok"
      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker tag "${IMAGE}:ci" "${IMAGE}:${GITHUB_SHA}"
          docker tag "${IMAGE}:ci" "${IMAGE}:latest"
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
